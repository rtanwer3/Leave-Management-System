<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Leave Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        input.error, select.error {
            border-color: #f44336;
        }

        .error-message {
            color: #f44336;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .message.show {
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .helper-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .school-selector {
            margin-bottom: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .school-selector label {
            color: #667eea;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">👨‍🏫</div>
            <h1>Teacher Registration</h1>
            <p>Create your account to manage leave applications</p>
        </div>

        <div id="status-message" class="message"></div>

        <form id="registration-form">
            <!-- School Selection -->
            <div class="school-selector">
                <div class="form-group">
                    <label for="school_id">Select Your School *</label>
                    <select id="school_id" name="school_id" required>
                        <option value="">-- Select School --</option>
                        <!-- Will be populated dynamically -->
                    </select>
                    <div class="error-message" id="school_id-error"></div>
                </div>
            </div>

            <!-- Personal Information -->
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your full name"
                    required
                    minlength="3"
                >
                <div class="helper-text">Use full name with surname (e.g., John Smith)</div>
                <div class="error-message" id="name-error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your.email@example.com"
                    required
                >
                <div class="error-message" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input 
                    type="tel" 
                    id="mobile" 
                    name="mobile" 
                    placeholder="10-digit mobile number"
                    required
                    pattern="[6-9][0-9]{9}"
                    maxlength="10"
                >
                <div class="helper-text">Enter 10-digit mobile number (starts with 6-9)</div>
                <div class="error-message" id="mobile-error"></div>
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <input 
                    type="text" 
                    id="department" 
                    name="department" 
                    placeholder="e.g., Mathematics, Science, English"
                    required
                >
                <div class="error-message" id="department-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Create a strong password"
                    required
                    minlength="6"
                >
                <div class="helper-text">Minimum 6 characters</div>
                <div class="error-message" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password *</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    name="confirm-password" 
                    placeholder="Re-enter your password"
                    required
                    minlength="6"
                >
                <div class="error-message" id="confirm-password-error"></div>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="index.html">Login here</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8001';

        // Load schools on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSchools();
            setupFormValidation();
        });

        // Load schools list
        async function loadSchools() {
            try {
                console.log('📡 Fetching schools from:', `${API_BASE}/api/schools`);
                
                const response = await fetch(`${API_BASE}/api/schools`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📦 Raw response:', data);
                
                // Extract schools array from response
                let schools = data.schools || data;
                
                // Ensure schools is an array
                if (!Array.isArray(schools)) {
                    console.error('❌ Schools is not an array:', schools);
                    throw new Error('Invalid response format - expected array');
                }

                const schoolSelect = document.getElementById('school_id');
                schoolSelect.innerHTML = '<option value="">-- Select School --</option>';

                let activeSchoolsCount = 0;
                schools.forEach(school => {
                    // All schools from API are active (already filtered by backend)
                    const option = document.createElement('option');
                    option.value = school.school_id;
                    option.textContent = school.school_name;
                    option.dataset.schoolName = school.school_name;
                    schoolSelect.appendChild(option);
                    activeSchoolsCount++;
                });

                console.log(`✅ Schools loaded: ${activeSchoolsCount} schools`);
                
                if (activeSchoolsCount === 0) {
                    showMessage('No active schools found. Please contact administrator.', 'error');
                }
            } catch (error) {
                console.error('❌ Error loading schools:', error);
                showMessage(`Failed to load schools: ${error.message}. Please refresh the page.`, 'error');
                
                // Add manual school entry option as fallback
                const schoolSelect = document.getElementById('school_id');
                schoolSelect.innerHTML = `
                    <option value="">-- Select School --</option>
                    <option value="1">THE GURUKUL JYOTISAR</option>
                    <option value="2">THE GURUKUL NILOKHERI</option>
                    <option value="3">ARYAKULUM NILOKHERI</option>
                `;
            }
        }

        // Setup form validation
        function setupFormValidation() {
            const form = document.getElementById('registration-form');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                clearErrors();
                
                // Validate
                if (!validateForm()) {
                    return;
                }
                
                await handleRegistration();
            });

            // Real-time validation
            document.getElementById('mobile').addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
            });

            document.getElementById('confirm-password').addEventListener('input', validatePasswordMatch);
        }

        // Validate form
        function validateForm() {
            let isValid = true;

            // Name
            const name = document.getElementById('name').value.trim();
            if (name.length < 3) {
                showError('name', 'Name must be at least 3 characters');
                isValid = false;
            }

            // Email
            const email = document.getElementById('email').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('email', 'Please enter a valid email address');
                isValid = false;
            }

            // Mobile
            const mobile = document.getElementById('mobile').value;
            if (!/^[6-9][0-9]{9}$/.test(mobile)) {
                showError('mobile', 'Mobile must be 10 digits starting with 6-9');
                isValid = false;
            }

            // Department
            const department = document.getElementById('department').value.trim();
            if (department.length < 2) {
                showError('department', 'Please enter your department');
                isValid = false;
            }

            // Password
            const password = document.getElementById('password').value;
            if (password.length < 6) {
                showError('password', 'Password must be at least 6 characters');
                isValid = false;
            }

            // Confirm password
            const confirmPassword = document.getElementById('confirm-password').value;
            if (password !== confirmPassword) {
                showError('confirm-password', 'Passwords do not match');
                isValid = false;
            }

            // School
            const schoolId = document.getElementById('school_id').value;
            if (!schoolId) {
                showError('school_id', 'Please select your school');
                isValid = false;
            }

            return isValid;
        }

        // Validate password match
        function validatePasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (confirmPassword && password !== confirmPassword) {
                showError('confirm-password', 'Passwords do not match');
            } else {
                clearError('confirm-password');
            }
        }

        // Handle registration
        async function handleRegistration() {
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                const schoolSelect = document.getElementById('school_id');
                const selectedOption = schoolSelect.options[schoolSelect.selectedIndex];

                const userData = {
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    mobile: document.getElementById('mobile').value,
                    department: document.getElementById('department').value.trim(),
                    password: document.getElementById('password').value,
                    school_id: schoolSelect.value,
                    school_name: selectedOption.dataset.schoolName
                };

                console.log('📤 Sending registration request:', { ...userData, password: '***' });

                const response = await fetch(`${API_BASE}/user/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (response.ok) {
                    console.log('✅ Registration successful:', data);
                    showMessage('Account created successfully! Redirecting to login...', 'success');
                    
                    // Reset form
                    document.getElementById('registration-form').reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    console.error('❌ Registration failed:', data);
                    showMessage(data.detail || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('❌ Error during registration:', error);
                showMessage('An error occurred. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }

        // Show error
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(`${fieldId}-error`);
            
            field.classList.add('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // Clear error
        function clearError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(`${fieldId}-error`);
            
            field.classList.remove('error');
            errorDiv.textContent = '';
            errorDiv.classList.remove('show');
        }

        // Clear all errors
        function clearErrors() {
            document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.classList.remove('show');
            });
        }

        // Show message
        function showMessage(message, type) {
            const messageDiv = document.getElementById('status-message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type} show`;
            
            // Scroll to top to see message
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Hide after 5 seconds for error messages
            if (type === 'error') {
                setTimeout(() => {
                    messageDiv.classList.remove('show');
                }, 5000);
            }
        }
    </script>
</body>
</html>
