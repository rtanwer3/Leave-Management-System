<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - Leave Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1>🔐 Reset Admin Password</h1>
            <p style="color: #666; margin-bottom: 2rem;">Enter your admin email and create a new password</p>
            
            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">📧 Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your registered email"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 New Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter new password (min 6 characters)"
                            minlength="6"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            👁️
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">🔒 Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">
                            👁️
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Reset Password</button>
                <div id="message" class="message"></div>
            </form>
            
            <div class="login-footer" style="margin-top: 2rem; text-align: center;">
                <a href="admin-login.html" style="color: #2196F3; text-decoration: none;">← Back to Admin Login</a>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8001';
        
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }
        
        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitButton = e.target.querySelector('button[type="submit"]');
            
            // Clear previous message
            messageDiv.style.display = 'none';
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Please enter a valid email address';
                messageDiv.style.display = 'block';
                return;
            }
            
            // Validate passwords match
            if (password !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Passwords do not match!';
                messageDiv.style.display = 'block';
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Password must be at least 6 characters long';
                messageDiv.style.display = 'block';
                return;
            }
            
            // Disable button during submission
            submitButton.disabled = true;
            submitButton.textContent = 'Resetting...';
            
            try {
                const response = await fetch(`${API_BASE}/admin/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ ' + (data.message || 'Password reset successful! Redirecting to login...');
                    messageDiv.style.display = 'block';
                    
                    // Clear form
                    document.getElementById('forgot-password-form').reset();
                    
                    // Redirect to admin login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'admin-login.html';
                    }, 2000);
                    
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (data.detail || 'Password reset failed');
                    messageDiv.style.display = 'block';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Reset Password';
                }
                
            } catch (error) {
                console.error('Error:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Network error. Please check your connection and try again.';
                messageDiv.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
